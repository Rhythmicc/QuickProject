[build-system]
requires = ["hatchling>=1.24.0,<1.27.0"]
build-backend = "hatchling.build"

[project]
name = "veyo"
version = "0.15.0"
description = "A lightweight CLI framework and terminal interaction toolkit"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
	{name = "Rhythmicc", email = "rhythmlian.cn@gmail.com"}
]
dependencies = [
	"rich>=13.3.5",
	"inquirer-rhy>=0.1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["veyo"]

[tool.hatch.build.targets.sdist]
include = [
	"veyo",
	"README.md",
	"LICENSE",
]
